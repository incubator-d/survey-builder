questions:
  - text: "Vos bases de données sont-elles déployées en haute disponibilité avec réplication (master/slave, primary/replica) ?"
    description: "Réplication pour la redondance et la lecture distribuée. Essentiel pour la disponibilité et le scaling des lectures."
    category: DB
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Avez-vous mis en place une stratégie de sharding ou partitionnement pour distribuer les données ?"
    description: "Partitionnement horizontal des données pour permettre le scaling au-delà des limites d'une seule instance. Critique pour les grandes bases de données."
    category: DB
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Utilisez-vous des read replicas pour distribuer les lectures et améliorer les performances ?"
    description: "Répliques en lecture seule pour distribuer la charge de lecture et améliorer les temps de réponse."
    category: DB
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Avez-vous mis en place un système de connection pooling pour optimiser les connexions DB ?"
    description: "Pool de connexions pour réutiliser les connexions et réduire la surcharge. Essentiel pour le scaling des applications."
    category: DB
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Effectuez-vous des sauvegardes automatiques avec rotation et tests de restauration réguliers ?"
    description: "Sauvegardes automatisées quotidiennes, tests de restauration mensuels minimum. Critique pour la continuité d'activité."
    category: DB
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Avez-vous un système de monitoring des performances de base de données (slow queries, index usage) ?"
    description: "Monitoring des requêtes lentes, utilisation des index, et métriques de performance. Essentiel pour identifier les goulots d'étranglement."
    category: DB
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Votre base de données est-elle infogérée (managée) avec scaling automatique ?"
    description: "Base de données managée (Scalingo, Scaleway, AWS RDS) avec capacité de scaling automatique selon la charge."
    category: DB
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Avez-vous une stratégie de migration de schéma avec rollback et versioning ?"
    description: "Migrations de schéma versionnées, réversibles, et testées. Essentiel pour évoluer la base de données sans downtime."
    category: DB
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Utilisez-vous des index optimisés et un plan d'optimisation des requêtes régulier ?"
    description: "Index stratégiques, analyse régulière des plans d'exécution, optimisation des requêtes lentes. Critique pour les performances à grande échelle."
    category: DB
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Avez-vous mis en place un système de cache de requêtes fréquentes au niveau applicatif ?"
    description: "Cache des résultats de requêtes fréquentes pour réduire la charge sur la base de données et améliorer les performances."
    category: DB
    requires_percentage: true
    expected_answer: Oui



