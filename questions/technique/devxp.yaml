questions:
  - text: "Un nouveau développeur peut-il démarrer le projet en moins de 30 minutes avec la documentation ?"
    description: "Documentation claire, environnement de développement simple à mettre en place, onboarding rapide. Essentiel pour le scaling de l'équipe."
    category: DevXP
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Avez-vous un environnement de développement local facile à configurer (Docker Compose, Vagrant, etc.) ?"
    description: "Configuration automatisée via Docker Compose, Vagrant, ou équivalent. Réduit les frictions et les erreurs de configuration."
    category: DevXP
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Votre codebase a-t-il une couverture de tests suffisante (> 70%) avec tests unitaires et d'intégration ?"
    description: "Tests unitaires, d'intégration, couverture mesurée et suivie. Essentiel pour la confiance lors des refactorings et le scaling."
    category: DevXP
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Avez-vous des outils de qualité de code intégrés (linters, formatters) avec application automatique ?"
    description: "ESLint, Prettier, Rubocop, ou équivalents configurés et appliqués automatiquement dans le CI/CD. Assure la cohérence du code."
    category: DevXP
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Votre documentation technique est-elle à jour et facilement accessible (README, docs inline, guides) ?"
    description: "Documentation inline, README complet, guides de développement. Essentiel pour la productivité et l'onboarding."
    category: DevXP
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Avez-vous un système de revue de code (code review) systématique avec guidelines claires ?"
    description: "Toutes les modifications passent par une revue avant merge, guidelines de review. Améliore la qualité et le partage de connaissances."
    category: DevXP
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Avez-vous mis en place un système de pré-commit hooks pour valider le code avant commit ?"
    description: "Hooks Git pour linter, formatter, et tests rapides avant commit. Réduit les erreurs et améliore la qualité."
    category: DevXP
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Votre CI/CD fournit-il un feedback rapide (< 10 minutes) aux développeurs ?"
    description: "Pipeline CI/CD rapide pour un feedback immédiat. Essentiel pour la productivité et la qualité."
    category: DevXP
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Avez-vous des outils de debugging et de profiling intégrés pour faciliter le développement ?"
    description: "Outils de debugging, profiling, et monitoring intégrés dans l'environnement de développement. Facilite la résolution de problèmes."
    category: DevXP
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Avez-vous mis en place un système de pair programming ou de mob programming pour le partage de connaissances ?"
    description: "Pratiques de collaboration pour partager les connaissances et améliorer la qualité du code. Essentiel pour le scaling de l'équipe."
    category: DevXP
    requires_percentage: false
    expected_answer: Oui



