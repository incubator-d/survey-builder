questions:
  - text: "L'application est-elle déployée chez un hébergeur souverain ?"
    description: "Entreprise et serveurs en Union Européenne - Critère essentiel pour les projets publics et sensibles"
    category: Infra
    requires_percentage: true
    expected_answer: Oui
    links:
      - "https://www.numerique.gouv.fr/services/cloud/doctrine/"
      - "https://www.numerique.gouv.fr/services/cloud/regles-doctrine/#contenu"
  
  - text: "Votre infrastructure supporte-t-elle le scaling horizontal automatique (auto-scaling) ?"
    description: "Capacité à augmenter/diminuer automatiquement le nombre d'instances selon la charge. Essentiel pour gérer les pics de trafic sans sur-provisionner en permanence."
    category: Infra
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Avez-vous mis en place un CDN (Content Delivery Network) pour les assets statiques ?"
    description: "CDN pour servir images, CSS, JS depuis des serveurs proches des utilisateurs. Réduit la latence et la charge sur vos serveurs, essentiel pour le scaling."
    category: Infra
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Utilisez-vous un système de cache distribué (Redis, Memcached) pour améliorer les performances ?"
    description: "Cache distribué pour réduire la charge sur les bases de données et améliorer les temps de réponse. Critique pour le scaling."
    category: Infra
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Votre load balancer utilise-t-il des algorithmes avancés (round-robin, least connections, IP hash) ?"
    description: "Distribution intelligente de la charge entre plusieurs instances pour optimiser les performances et la disponibilité."
    category: Infra
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Avez-vous une architecture multi-régions pour la résilience et la performance globale ?"
    description: "Déploiement dans plusieurs régions géographiques pour réduire la latence et assurer la continuité en cas de panne régionale."
    category: Infra
    requires_percentage: false
    expected_answer: Oui
  
  - text: "Votre infrastructure est-elle gérée \"As Code\" (Terraform, OpenTofu, Pulumi) ?"
    description: "Infrastructure as Code permet la reproductibilité, la versioning, et le déploiement rapide de nouveaux environnements. Essentiel pour le scaling et la collaboration."
    category: Infra
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Avez-vous mis en place un système de logs centralisé et analysable (ELK, Loki, Datadog) ?"
    description: "Centralisation des logs pour le debugging, le monitoring, et l'analyse de performance à grande échelle."
    category: Infra
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Utilisez-vous des containers (Docker) et orchestration (Kubernetes, Docker Swarm) ?"
    description: "Containerisation et orchestration pour faciliter le déploiement, le scaling, et la gestion de multiples services."
    category: Infra
    requires_percentage: true
    expected_answer: Oui
  
  - text: "Avez-vous une documentation à jour de votre architecture infrastructure avec diagrammes ?"
    description: "Documentation claire de l'architecture, des flux de données, et des dépendances. Essentiel pour l'onboarding et la maintenance à grande échelle."
    category: Infra
    requires_percentage: false
    expected_answer: Oui



