[package]
name = "survey-audit"
version = "0.1.0"
edition = "2021"
authors = ["kdelfour"]
description = "Outil d'audit technique et business pour projets"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.7", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
ratzilla = "0.3"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "console", "Document", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "Url", "Blob", "BlobPropertyBag", "CssStyleDeclaration"] }

